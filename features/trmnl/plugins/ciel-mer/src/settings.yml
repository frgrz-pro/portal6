---
# Définition du plugin, poussée telle quelle vers TRMNL par `trmnlp push`.
name: Ciel & Mer
# id : identifiant du plugin côté TRMNL, renseigné après la première création.
# ⚠️ Sans lui, chaque `trmnlp push` crée un NOUVEAU plugin au lieu de mettre à
#    jour le sien. À récupérer avec `trmnlp list`, puis coller ici et commiter.
# id:
strategy: polling
polling_verb: get
# Le payload est régénéré 4x/jour par .github/workflows/trmnl-ciel-mer.yml
# et servi en brut par GitHub — aucune infra à héberger.
polling_url: https://raw.githubusercontent.com/frgrz-pro/portal6/main/features/trmnl/payloads/ciel-mer.json
refresh_interval: 60
dark_mode: no
no_screen_padding: no
custom_fields: []
