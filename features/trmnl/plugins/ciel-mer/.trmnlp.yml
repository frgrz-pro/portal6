---
# Config du serveur de dev local (`trmnlp serve`). N'est jamais envoyée à TRMNL.
watch:
  - src

# La stratégie du plugin étant `polling`, trmnlp récupère lui-même le payload à
# l'URL de settings.yml. Pour travailler hors ligne (ou sur un cas limite : pas de
# marée, éclipse à venir…), décommenter et coller un payload de test ici — il prend
# alors le pas sur l'appel réseau.
# variables:
#   spot: "Spot de test"
#   moon:
#     illumination: 24
#     phase: "Croissant décroissant"
#     svg_path: "M 46 6 A 40 40 0 0 0 46 86 A 20.58 40 0 0 0 46 6 Z"
