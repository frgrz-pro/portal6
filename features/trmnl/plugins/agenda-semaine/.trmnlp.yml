---
# Config du serveur de dev local (`trmnlp serve`). N'est jamais envoyée à TRMNL.
watch:
  - src

# Le plugin étant en webhook, trmnlp n'a aucune donnée à aller chercher : on lui
# fournit un jeu d'essai. Générer un payload réel sans rien envoyer avec
#   python features/trmnl/data/build_agenda.py --print
variables:
  generated_at: "06/09 18h20"
  count: 5
  hidden: 0
  days:
    - label: "Sam 06"
      today: true
      events:
        - { time: "journée", title: "Weekend", cal: "P" }
        - { time: "14h00", title: "Playoffs LEC — Madrid", cal: "S" }
    - label: "Dim 07"
      today: false
      events:
        - { time: "17h00", title: "Finale LEC", cal: "S" }
    - label: "Lun 08"
      today: false
      events: []
    - label: "Mar 09"
      today: false
      events:
        - { time: "09h30", title: "Rendez-vous", cal: "P" }
    - label: "Mer 10"
      today: false
      events: []
    - label: "Jeu 11"
      today: false
      events:
        - { time: "20h00", title: "Match Vitality", cal: "S" }
    - label: "Ven 12"
      today: false
      events: []
