---
# Définition du plugin, poussée telle quelle vers TRMNL par `trmnlp push`.
# Stratégie webhook : c'est build_agenda.py qui POSTe le payload (données privées,
# jamais commitées — cf. la docstring du script). TRMNL plafonne à 2 Ko par envoi.
name: Agenda semaine
strategy: webhook
refresh_interval: 60
dark_mode: no
no_screen_padding: no
custom_fields: []
