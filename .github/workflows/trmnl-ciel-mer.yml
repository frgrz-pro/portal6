name: trmnl-ciel-mer

# Regénère le payload du private plugin « Ciel & Mer » et le commite : TRMNL le
# récupère ensuite en polling sur raw.githubusercontent.com (aucune infra à héberger).
# Le payload ne contient que des données publiques (spot, éphémérides, météo, marées).

on:
  schedule:
    - cron: "17 */3 * * *" # toutes les 3 h
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trmnl-ciel-mer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regénérer le payload
        run: python features/trmnl/data/build_ciel_mer.py
      - name: Commit si changement réel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add features/trmnl/payloads
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "trmnl : refresh du payload ciel-mer"
            git push
          fi
