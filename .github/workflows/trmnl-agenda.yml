name: trmnl-agenda

# Pousse l'agenda de la semaine vers le webhook du private plugin TRMNL.
# Aucune donnée n'est écrite dans le repo : les agendas sont privés, le repo est public.
#
# Secrets à créer dans Settings → Secrets and variables → Actions :
#   AGENDA_ICS_URLS    une ligne `CODE|URL` par agenda (adresse secrète iCal Google)
#   TRMNL_WEBHOOK_URL  URL affichée sur la page du private plugin

on:
  schedule:
    - cron: "35 4,10,16 * * *" # 3x/jour ; le webhook TRMNL est limité à 12 envois/h
  workflow_dispatch:

concurrency:
  group: trmnl-agenda
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install icalendar recurring-ical-events
      - name: Pousser l'agenda
        run: python features/trmnl/data/build_agenda.py
        env:
          AGENDA_ICS_URLS: ${{ secrets.AGENDA_ICS_URLS }}
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
