name: trmnl-dashboard

# Régénère le payload du dashboard TRMNL et le publie dans un gist secret.
# Rien n'est écrit dans le repo : le payload peut contenir des agendas privés,
# et portal6 est public.
#
# Les agendas PUBLICS sont dans features/trmnl/data/config.json (clé `agendas`) —
# aucun secret nécessaire pour eux.
#
# Secrets à créer dans Settings → Secrets and variables → Actions :
#   GIST_ID          identifiant du gist secret qui porte dashboard.json
#   GIST_TOKEN       PAT avec la seule portée `gist`
#   AGENDA_ICS_URLS  (optionnel) agendas PRIVÉS, une ligne `CODE|URL` par agenda

on:
  schedule:
    - cron: "17 */3 * * *" # toutes les 3 h
  workflow_dispatch:

concurrency:
  group: trmnl-dashboard
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install icalendar recurring-ical-events
      - name: Publier le payload
        run: python features/trmnl/data/build_dashboard.py
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          AGENDA_ICS_URLS: ${{ secrets.AGENDA_ICS_URLS }}
