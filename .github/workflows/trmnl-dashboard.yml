name: trmnl-dashboard

# Régénère le payload unique du dashboard TRMNL et le publie dans un gist secret.
# Rien n'est écrit dans le repo : le payload contient l'agenda perso, et portal6 est public.
#
# Secrets à créer dans Settings → Secrets and variables → Actions :
#   AGENDA_ICS_URLS  une ligne `CODE|URL` par agenda (adresse secrète iCal Google)
#   GIST_ID          identifiant du gist secret qui porte dashboard.json
#   GIST_TOKEN       jeton personnel avec la seule portée `gist`

on:
  schedule:
    - cron: "17 */3 * * *" # toutes les 3 h
  workflow_dispatch:

concurrency:
  group: trmnl-dashboard
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install icalendar recurring-ical-events
      - name: Publier le payload
        run: python features/trmnl/data/build_dashboard.py
        env:
          AGENDA_ICS_URLS: ${{ secrets.AGENDA_ICS_URLS }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
